name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `nx affected` can compute the base comparison.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, build, test (affected)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint build test --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Lint, build, test (all projects)
        if: github.event_name == 'push'
        run: npx nx run-many -t lint build test